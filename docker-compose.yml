# Backend stack: Postgres (pgvector + the RAG index) and the backend API. One compose file, two images, built here and pushed to a PRIVATE Docker Hub repository.
#
#   cp .env.example .env          # fill in
#   docker compose build          # builds flame-postgres and flame-backend-api (tags from .env)
#   docker compose push           # to Docker Hub (docker login first)
#   --- on the server (only this file + .env are needed) ---
#   docker login && docker compose pull && docker compose up -d
#   docker compose --profile https up -d          # + Caddy for https on API_DOMAIN
#   docker compose --profile self-hosted-agent up -d   # only if the agent runs here instead of LiveKit Cloud
name: flame

x-backend: &backend
  image: ${DOCKERHUB_USER:?set DOCKERHUB_USER in .env}/flame-backend-api:${TAG:-1.0}
  build:
    context: .
    dockerfile: backend-api/Dockerfile
  env_file: ${ENV_FILE:-.env}
  environment:
    LIVEKIT_URL: ${LIVEKIT_URL:?set LIVEKIT_URL in .env}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_MAIN_DB: ${POSTGRES_DB:-paper_rag}
    TABLE_NAME: chunks_cohere
    EMBEDDING_PROVIDER: cohere
    EMBEDDING_SIZE: "1024"
    EMBEDDING_MODEL_ID: embed-v4.0
    CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in .env (your Firebase site, e.g. https://x.web.app)}
  volumes:
    - ${DOCS_DIR:-./data/docs}:/data/docs:ro
    - rag_cache:/app/rag_cache
    - logs:/app/logs
  depends_on:
    postgres: {condition: service_healthy}
  restart: unless-stopped

services:
  postgres:
    image: ${DOCKERHUB_USER}/flame-postgres:${TAG:-1.0}
    build:
      context: data/postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-paper_rag}
    volumes:
      - pgdata:/var/lib/postgresql          # PG 18: the volume is the parent of the version folder
    # Sized for the 1 GB / 2 vCPU server. plan_cache_mode=force_custom_plan: asyncpg's prepared statements otherwise switch to a
    # generic plan that filters on the text_origin btree and sorts all 17k rows (4.4 s) instead of using the HNSW index (~130 ms).
    command: >-
      postgres
      -c shared_buffers=224MB
      -c effective_cache_size=512MB
      -c max_connections=30
      -c plan_cache_mode=force_custom_plan
      -c jit=off
      -c hnsw.iterative_scan=strict_order
      -c hnsw.ef_search=100
      -c shared_preload_libraries=pg_prewarm
      -c "log_line_prefix=%m [%p] %a "
    # not published: only the other containers (and `docker compose exec postgres psql ...`) reach it
    restart: unless-stopped

  api:
    <<: *backend
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"       # 127.0.0.1 behind Caddy / nginx; 0.0.0.0 to publish it directly

  agent:
    <<: *backend
    profiles: [self-hosted-agent]
    command: python -m src.agent start

  caddy:
    profiles: [https]
    image: caddy:2
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    ports:
      - "80:80"
      - "443:443"
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
  rag_cache:
  logs:
  caddy_data:
