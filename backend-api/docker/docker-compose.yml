services:

  pgvector:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    container_name: pgvector
    ports:
      - "5432:5432"
    volumes:
      - paper_data:/var/lib/postgresql
    env_file:
      - ./env/.env.postgres
    restart: always
    networks:
      - backend

volumes:
  paper_data:

networks:
  backend:
